# Port declarations for port-for allocation (ADR 0003 + 2026-04-11 amendment).
#
# Schema: Option D (project-sharded slots).
#   Inbox owns the 385xx backend slot and 585xx frontend slot.
#   Sub-bands within each slot (per ADR 0003 amendment):
#     00-09 core   10-39 prod   40-69 dev   70-89 test   90-99 scratch
#
# Migration (2026-04-11):
#   Inbox's live ports previously sat at 38850 / 58850, which overlap with
#   CPC's backend slot (388xx) and CPC's frontend slot (588xx) under the
#   new project-sharded taxonomy. Inbox now gets its own 385xx / 585xx
#   slot. Canonical dev ports are renumbered from 38850 → 38550 and
#   58850 → 58550. This is a one-time break: Caddy routes, source files,
#   and any running dev servers must be updated together.
#
# Source files touched in this migration:
#   - packages/bff/src/index.ts           (PORT = 38850 → 38550)
#   - packages/ui/vite.config.ts          (server.port + /api proxy target)
#   - packages/ui/package.json            (dev script --port flag)
#   - packages/ui/playwright.config.ts    (baseURL + webServer.url)
#
# Host-level follow-ups (NOT in this PR, require sudo / ops coordination):
#   - /etc/caddy/Caddyfile: inbox.claude.do reverse_proxy targets on
#     38850 + 58850 must move to 38550 + 58550.
repo: inbox
purposes:
  - name: inbox-backend-dev
    type: backend
    env: dev
    canonical: 38550    # @inbox/bff (Hono on Node)
  - name: inbox-frontend-dev
    type: frontend
    env: dev
    canonical: 58550    # @inbox/ui (Vite dev server, base=/app/)
